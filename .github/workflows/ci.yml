name: CI

# What CI can and cannot do here is worth stating plainly, because it is unusual.
#
# GitHub's macOS runners are virtual machines. They have no SMC. They cannot spin a fan,
# read a temperature, or verify that a single write to firmware did what it claimed.
# Everything below builds, lints, and tests the parts of Aeolus that are hardware-
# independent — which is most of the code, but explicitly not the part that matters most.
#
# Hardware verification is manual and always will be. See docs/HARDWARE-MATRIX.md.
#
# CI builds the Monitor configuration only. Full requires a Developer ID certificate that
# exists on exactly one machine, so it is built on maintainer tags, never on a pull
# request — including pull requests from forks, which must never have access to signing
# material.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # Libraries, CLI, helper, and every test. No Xcode project, no signing.
      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test --skip-build

      # Not redundant with the step above. Some behaviour is selected by `#if DEBUG` and is
      # therefore invisible to a Debug-only test run — notably
      # ClientRequirementVariant.forRunningProcess, where the failure being guarded is a
      # Release helper shipping the relaxed development client requirement. The test that
      # catches it mirrors the same `#if`, so it can only assert the dangerous arm when the
      # suite itself is built Release. `-enable-testing` is what keeps `@testable import`
      # working in a Release build.
      - name: Test (release configuration)
        run: swift test -c release -Xswiftc -enable-testing

  monitor-app:
    name: Monitor app build
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      # Configs/Signing.xcconfig is absent here, as it is on every contributor's machine.
      # If this step fails, the repository has grown a dependency on the maintainer's
      # signing identity — which would lock out every outside contributor.
      - name: Generate project
        run: xcodegen generate

      # The binary assertion further down sees one configuration, Monitor Debug. The
      # `fanctl` that docs/RECOVERY.md sends a user to for `reset --all` is the Full
      # Release one, which no job here builds: it needs the maintainer's Developer ID.
      # A configuration-specific override in project.yml — a `.debug` suffix on the
      # identifier, `CREATE_INFOPLIST_SECTION_IN_BINARY: NO`, a `--identifier` signing
      # flag — would leave every test and the Monitor Debug binary correct while that
      # configuration signs with an identifier the helper refuses, and the refusal reads
      # as "no helper installed".
      #
      # So this asks Xcode what each configuration *resolves* for the fanctl target.
      # `-showBuildSettings` needs no signing and no Signing.xcconfig, and it is the same
      # answer the build would act on. It cannot see Configs/Signing.xcconfig, which is
      # gitignored and absent here; only `codesign -dv` on the maintainer's signed Full
      # build can, and that stays the owner's check on #82.
      #
      # The configuration list is written out, not discovered. A configuration added to
      # project.yml has to be added here, which is a deliberate edit in the same PR rather
      # than a check that quietly widens or narrows.
      #
      # An absent OTHER_CODE_SIGN_FLAGS is how Xcode reports "unset", so it is not an
      # error; an absent PRODUCT_BUNDLE_IDENTIFIER or CREATE_INFOPLIST_SECTION_IN_BINARY
      # is, because it would mean the output was not what this step parses.
      - name: Assert every configuration signs fanctl with the identifier the helper pins
        run: |
          set -euo pipefail
          EXPECTED=$(scripts/pinned-fanctl-identifier.sh)
          SETTINGS="${RUNNER_TEMP:-/tmp}/fanctl-build-settings.txt"

          # The value of one build setting from ${SETTINGS}, or nothing if it is unset.
          # Anchored on the four-space indent and the whole key, so a key that merely
          # contains this name cannot match. More than one match is returned as is, and
          # the caller's comparison then fails.
          setting() {
              sed -n "s/^    $1 = *\(.*\)\$/\1/p" "${SETTINGS}"
          }

          for CONFIG in "Monitor Debug" "Monitor Release" "Full Debug" "Full Release"; do
              xcodebuild \
                -project Aeolus.xcodeproj \
                -target fanctl \
                -configuration "${CONFIG}" \
                -showBuildSettings > "${SETTINGS}"

              IDENTIFIER=$(setting PRODUCT_BUNDLE_IDENTIFIER)
              if [ "${IDENTIFIER}" != "${EXPECTED}" ]; then
                  echo "error: fanctl resolves PRODUCT_BUNDLE_IDENTIFIER to '${IDENTIFIER}' in ${CONFIG}; the helper pins '${EXPECTED}'."
                  exit 1
              fi

              EMBEDDED=$(setting CREATE_INFOPLIST_SECTION_IN_BINARY)
              if [ "${EMBEDDED}" != "YES" ]; then
                  echo "error: fanctl resolves CREATE_INFOPLIST_SECTION_IN_BINARY to '${EMBEDDED}' in ${CONFIG}; without the embedded Info.plist codesign names the binary after its file."
                  exit 1
              fi

              # `-i` and `--identifier` are codesign's own override of whatever the
              # Info.plist says, `-i` also in its attached form (`-ifoo`).
              FLAGS=$(setting OTHER_CODE_SIGN_FLAGS)
              if printf '%s\n' "${FLAGS}" | grep -Eq -- '(^|[[:space:]])(--identifier|-i)'; then
                  echo "error: fanctl resolves OTHER_CODE_SIGN_FLAGS to '${FLAGS}' in ${CONFIG}; a signing flag that sets the identifier overrides the one the helper pins."
                  exit 1
              fi

              echo "${CONFIG}: PRODUCT_BUNDLE_IDENTIFIER=${IDENTIFIER}, Info.plist embedded, no signing-flag identifier"
          done
          echo "RESOLVED IDENTIFIER ASSERTION PASSED: all four configurations resolve ${EXPECTED}"

      # A Full Release build must not sign anything with com.apple.security.get-task-allow,
      # because the boundary refuses it in both directions (#335). Xcode adds that entitlement
      # to a `build` when CODE_SIGN_INJECT_BASE_ENTITLEMENTS is YES, which is its default, and
      # then:
      #
      #   - the Release helper's client requirement ends in a clause that refuses any client
      #     carrying it (ClientRequirementText.debuggableEntitlement, ADR 0005), so the
      #     installed helper refuses Aeolus and fanctl;
      #   - every Release client's mirror requirement on the helper appends the same clause
      #     (HelperRequirementText), so a Release fanctl refuses a helper carrying it.
      #
      # The second direction is why AeolusHelper is in the loop below beside the two clients.
      # Dropping it would leave the daemon's own signature unchecked and fanctl unable to
      # trust the daemon it was built to talk to.
      #
      # Both refusals fail closed and look like nothing. The app opens no XPC connection yet
      # and shows only SMAppService status, so it would report the helper installed and
      # enabled; fanctl exits 3, as helperUnreachable when the helper refused the client and
      # as helperSignatureRejected when the client refused the helper.
      #
      # What this proves, and no more. No job here builds Full Release, so it cannot run
      # `codesign -d --entitlements -` on a signed binary; that stays the maintainer's check
      # on #82. It asks Xcode what Full Release *resolves* for each of the three targets that
      # get signed, which is the answer the build acts on and needs no signing and no
      # Signing.xcconfig, and it fails unless
      #   - CODE_SIGN_INJECT_BASE_ENTITLEMENTS resolves NO, and
      #   - the target's CODE_SIGN_ENTITLEMENTS file, if it names one, does not list
      #     get-task-allow (the other way that entitlement reaches a signature from the tree).
      # It does not see what Configs/Signing.xcconfig adds (gitignored, absent here), an
      # --entitlements flag in OTHER_CODE_SIGN_FLAGS, or a build phase that re-signs. The
      # three targets are written out, not discovered, as in the identifier step above. A new
      # signed target inherits the project-level NO unless it overrides it, and adding it
      # here is what would catch the override.
      #
      # Two guards keep it from passing on nothing. xcodebuild exits 0 and answers for a
      # different configuration when handed a name it does not know, so every answer must
      # say it is for the configuration asked. And a setting that is absent is an error, not
      # "unset": the output would not be what this step parses.
      #
      # The control is the other half. Full Debug is not under test, but it must resolve
      # CODE_SIGN_INJECT_BASE_ENTITLEMENTS to YES, which proves this runner's Xcode defaults
      # to injecting, so that Full Release's NO is project.yml's doing and not the Xcode
      # default. If a future Xcode changes that default the control fails; re-think the
      # Release assertion then, and do not delete the control.
      - name: Assert Full Release injects no get-task-allow entitlement
        run: |
          set -euo pipefail
          SETTINGS="${RUNNER_TEMP:-/tmp}/full-release-inject-settings.txt"

          # The value of one build setting from ${SETTINGS}, or nothing if it is unset.
          # Anchored on the four-space indent and the whole key, so a key that merely
          # contains this name cannot match. More than one match is returned as is, and
          # the caller's comparison then fails.
          setting() {
              sed -n "s/^    $1 = *\(.*\)\$/\1/p" "${SETTINGS}"
          }

          # What Xcode resolves for target $1 in configuration $2, into ${SETTINGS}. An answer
          # about any other configuration stops the step: xcodebuild exits 0 for a name it
          # does not know and answers for its default configuration instead.
          resolve() {
              xcodebuild \
                -project Aeolus.xcodeproj \
                -target "$1" \
                -configuration "$2" \
                -showBuildSettings > "${SETTINGS}"
              ANSWERED=$(setting CONFIGURATION)
              if [ "${ANSWERED}" != "$2" ]; then
                  echo "error: asked Xcode for $1 in '$2' and it answered for '${ANSWERED}'."
                  exit 1
              fi
          }

          resolve fanctl "Full Debug"
          CONTROL=$(setting CODE_SIGN_INJECT_BASE_ENTITLEMENTS)
          if [ "${CONTROL}" != "YES" ]; then
              echo "error: fanctl resolves CODE_SIGN_INJECT_BASE_ENTITLEMENTS to '${CONTROL}' in Full Debug; the control expects YES."
              echo "That default is what makes Full Release's NO the project's doing. Re-think the Full"
              echo "Release assertion below for this Xcode; do not delete the control."
              exit 1
          fi
          echo "control: fanctl Full Debug CODE_SIGN_INJECT_BASE_ENTITLEMENTS=${CONTROL}"

          for TARGET in Aeolus AeolusHelper fanctl; do
              resolve "${TARGET}" "Full Release"

              # Which requirement refuses this target, for the error text. A client is
              # refused by the helper's client requirement; the helper by the clients' mirror.
              case "${TARGET}" in
                  AeolusHelper)
                      WHY="every Release client's mirror requirement on the helper (HelperRequirementText) refuses a helper carrying it, so Aeolus and fanctl would refuse the installed helper"
                      ;;
                  *)
                      WHY="the Release helper's client requirement (ClientRequirementText) refuses a client carrying it, so the installed helper would refuse ${TARGET}"
                      ;;
              esac

              INJECT=$(setting CODE_SIGN_INJECT_BASE_ENTITLEMENTS)
              if [ "${INJECT}" != "NO" ]; then
                  echo "error: ${TARGET} resolves CODE_SIGN_INJECT_BASE_ENTITLEMENTS to '${INJECT}' in Full Release; it must be NO."
                  echo "Xcode would sign it with com.apple.security.get-task-allow, and ${WHY}."
                  echo "See project.yml's Full Release settings and docs/ADR/0005-xpc-authorisation.md."
                  exit 1
              fi

              # The other way the entitlement reaches a signature from the tree: a target's
              # own entitlements file. A path that is not absolute is relative to SRCROOT.
              ENTITLEMENTS=$(setting CODE_SIGN_ENTITLEMENTS)
              if [ -n "${ENTITLEMENTS}" ]; then
                  case "${ENTITLEMENTS}" in
                      /*) FILE="${ENTITLEMENTS}" ;;
                      *) FILE="$(setting SRCROOT)/${ENTITLEMENTS}" ;;
                  esac
                  if ! plutil -lint "${FILE}"; then
                      echo "error: ${TARGET} names the entitlements file ${ENTITLEMENTS} in Full Release and it cannot be read as a property list, so it cannot be checked."
                      exit 1
                  fi
                  if /usr/libexec/PlistBuddy -c 'Print :com.apple.security.get-task-allow' "${FILE}" > /dev/null 2>&1; then
                      echo "error: ${TARGET}'s entitlements file ${ENTITLEMENTS} lists com.apple.security.get-task-allow in Full Release."
                      echo "Xcode would sign it with that entitlement, and ${WHY}."
                      exit 1
                  fi
              fi

              echo "${TARGET}: Full Release CODE_SIGN_INJECT_BASE_ENTITLEMENTS=${INJECT}, CODE_SIGN_ENTITLEMENTS=${ENTITLEMENTS:-none}, no get-task-allow listed"
          done
          echo "FULL RELEASE ENTITLEMENT ASSERTION PASSED: Aeolus, AeolusHelper and fanctl resolve CODE_SIGN_INJECT_BASE_ENTITLEMENTS NO and name no get-task-allow"

      # This scheme compiles the AeolusHelper target, and that is the point of the job as
      # much as the app is. `swift build` compiles the helper *inside* the SwiftPM package;
      # xcodebuild compiles it as a native target that merely depends on the SMCCore
      # product, which is the only build where the package boundary is real. The SMC write
      # seam is gated on that boundary — `@_spi(FanWrite) public`, reached by
      # Sources/AeolusHelper/WriteSeamReachability.swift, see the 2026-09-06 amendment in
      # docs/ADR/0008-write-authorisation.md — so an access level that stops resolving here
      # fails this step and nowhere else. It was `package` until #160, and `package` did
      # not reach this target at all; the same defect bit ClientAuthorisation once already.
      #
      # This step does not pass CODE_SIGNING_ALLOWED=NO, and the fanctl identifier assertion
      # further down is why. With signing disabled the linker still ad-hoc signs every
      # Mach-O, but it names the signature after the file — `Identifier=fanctl` — and
      # ignores the Info.plist embedded in the binary. The identifier the helper's client
      # requirement allow-lists is only applied when the target is really code signed. The
      # Monitor configurations sign ad hoc (CODE_SIGN_IDENTITY "-", Manual, no team), which
      # needs no certificate, no keychain and no secret, so a pull request from a fork
      # builds exactly as before.
      - name: Build Monitor configuration
        run: |
          set -o pipefail
          xcodebuild \
            -project Aeolus.xcodeproj \
            -scheme "Aeolus (Monitor)" \
            -configuration "Monitor Debug" \
            -destination "platform=macOS" \
            -derivedDataPath DerivedData \
            build

      # The step above cannot fail *silently*, but it can stop compiling the probe — a
      # dropped source file, a target reshuffle — and then it proves nothing while staying
      # green. This asserts the probe reached the binary, which is the artefact, not the
      # log. Both halves are named: the function that references `write(_:to:)`, and the one
      # that references `encode(scalar:byteOrder:)`.
      #
      # The symbol table is written to a file and grepped there rather than piped into
      # `grep -q`. Under `set -o pipefail` that pipeline returns 141 on *success*: `grep -q`
      # exits at the first match, `nm` dies on SIGPIPE with a megabyte still buffered, and
      # the step reports "has no ... symbol" for a binary that has it. #226's first CI run
      # failed exactly that way, on a build that was fine.
      #
      # The names are compared *demangled*. Swift's mangler substitutes repeated words, so
      # `WriteSeamReachability.namesTheWriteSeam` mangles to `...WriteSeamReachabilityO08
      # namesThecD02on...` and the literal `namesTheWriteSeam` never appears in `nm` output.
      # Grepping the raw table for the source spelling is a check that can only pass by
      # accident.
      - name: Assert the helper binary carries the write-seam probe
        run: |
          set -euo pipefail
          HELPER="DerivedData/Build/Products/Monitor Debug/AeolusHelper"
          test -x "${HELPER}" || { echo "error: no helper binary at ${HELPER}"; exit 1; }

          SYMBOLS="${RUNNER_TEMP:-/tmp}/helper-symbols.txt"
          nm "${HELPER}" > "${SYMBOLS}"
          xcrun swift-demangle < "${SYMBOLS}" > "${SYMBOLS}.demangled"

          probes=(
              "AeolusHelper.WriteSeamReachability.namesTheWriteSeam(on:"
              "AeolusHelper.WriteSeamReachability.namesTheEncodeSeam()"
          )
          for symbol in "${probes[@]}"; do
              if ! grep -qF -- "${symbol}" "${SYMBOLS}.demangled"; then
                  echo "error: ${HELPER} has no ${symbol} symbol."
                  echo "The write-seam reachability probe did not reach the helper binary,"
                  echo "so this job no longer proves the Xcode helper target can name the"
                  echo "SMC write seam. See docs/ADR/0008-write-authorisation.md."
                  exit 1
              fi
          done

          # A positive signal, so a reader of the log can tell "the probe was found" from
          # "the step ran and asserted nothing". #226's delta review caught the PR body
          # quoting exactly this line as evidence while the step was silent on success.
          echo "PROBE ASSERTION PASSED: both probe symbols are in ${HELPER}"

      # "The helper is absent from Monitor" is called a safety property in project.yml,
      # and until now nothing checked it: the embed script's Monitor branch asserts
      # nothing, so a configuration that gained AEOLUS_EMBEDS_HELPER: YES, or a Copy Files
      # phase substituted for the script, would keep CI green while the build every
      # contributor runs shipped a root daemon and its launchd job description.
      #
      # The property matters because a Monitor build is ad-hoc signed. An ad-hoc-signed
      # root daemon can express no stable client code-signing requirement, so it is a
      # daemon nothing could safely authorise — see docs/ADR/0005-xpc-authorisation.md.
      - name: Assert the Monitor bundle ships no helper
        run: |
          set -euo pipefail
          APP="DerivedData/Build/Products/Monitor Debug/Aeolus.app"
          test -d "${APP}" || { echo "error: no app bundle at ${APP}"; exit 1; }

          if [ -e "${APP}/Contents/MacOS/AeolusHelper" ]; then
              echo "error: the Monitor bundle contains the privileged helper"
              exit 1
          fi
          if [ -d "${APP}/Contents/Library" ]; then
              echo "error: the Monitor bundle contains Contents/Library (launchd job descriptions live there)"
              ls -R "${APP}/Contents/Library"
              exit 1
          fi

      # fanctl is the other binary in the bundle, and the one the helper's client
      # requirement names by code-signing identifier. Nothing else in the tree produces a
      # binary with that identifier: a fanctl signed under its file name is refused by the
      # helper, and the refusal looks exactly like "the helper is not installed" from the
      # client's side (docs/RECOVERY.md), which is the worst moment to discover it.
      #
      # The expected value is read out of ClientRequirementText.swift, the source the
      # helper's requirement is built from, rather than typed here a third time. The read
      # lives in scripts/pinned-fanctl-identifier.sh and fails closed, so a declaration
      # that no longer parses fails this step instead of asserting against nothing.
      # Tests/IntegrationTests/CommandLineIdentifierDriftTests.swift holds project.yml equal
      # to that same constant, and the step before the build holds every configuration's
      # *resolved* settings equal to it; this step holds the *built binary* equal to it,
      # which is the only place a signing setting that stopped taking effect would show.
      #
      # `codesign -dv` writes to stderr, and its output is read from a file rather than
      # piped into `grep -q` for the reason the probe step above gives.
      - name: Assert the embedded fanctl carries the identifier the helper pins
        run: |
          set -euo pipefail
          FANCTL="DerivedData/Build/Products/Monitor Debug/Aeolus.app/Contents/MacOS/fanctl"
          test -x "${FANCTL}" || { echo "error: no fanctl at ${FANCTL}"; exit 1; }

          EXPECTED=$(scripts/pinned-fanctl-identifier.sh)

          REPORT="${RUNNER_TEMP:-/tmp}/fanctl-codesign.txt"
          codesign -dv "${FANCTL}" 2> "${REPORT}"
          cat "${REPORT}"

          if ! grep -qxF -- "Identifier=${EXPECTED}" "${REPORT}"; then
              echo "error: ${FANCTL} is not signed with the identifier ${EXPECTED}."
              echo "The helper's client requirement would refuse it. See project.yml's fanctl"
              echo "target and docs/ADR/0005-xpc-authorisation.md."
              exit 1
          fi
          echo "FANCTL IDENTIFIER ASSERTION PASSED: Identifier=${EXPECTED}"

  lint:
    name: Lint and format
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: swift-format
        run: swift format lint --recursive --strict Sources Tests Tools

      - name: Install SwiftLint
        run: brew install swiftlint

      # Deliberately not --strict. .swiftlint.yml assigns severities on purpose: force
      # unwrapping is an error inside the helper and the SMC write path and a warning
      # elsewhere. --strict flattens that distinction and would fail the build on the
      # safe cases while saying nothing extra about the dangerous ones.
      - name: SwiftLint
        run: swiftlint lint
