# XcodeGen project definition.
#
# Aeolus.xcodeproj is generated, never committed: agents and humans both merge YAML
# vastly better than they merge project.pbxproj. Regenerate with:
#
#     xcodegen generate
#
# The libraries, the CLI, and the helper are defined in Package.swift and built with
# `swift build`. This file exists for the one thing SPM cannot produce: a signed
# Aeolus.app bundle with the privileged helper embedded inside it.
#
# ## Configurations
#
# Monitor — read-only. No helper, no entitlements, ad-hoc signable. Anyone can build and
#           run this with no Apple Developer account. All UI, sensor, chart, and catalog
#           work happens here, and it is what CI builds on every pull request.
# Full    — embeds and registers the privileged helper. Requires a real Developer ID and
#           a Team ID supplied via the gitignored Configs/Signing.xcconfig.
#
# See CONTRIBUTING.md.

name: Aeolus

options:
  bundleIdPrefix: com.blamechris
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top
  # Configs/Signing.xcconfig is gitignored and absent on every machine except the
  # maintainer's. Without this, `xcodegen generate` fails for contributors and on CI
  # before it ever reaches the Monitor build that does not need signing at all.
  disabledValidations:
    - missingConfigFiles

configs:
  Monitor Debug: debug
  Monitor Release: release
  Full Debug: debug
  Full Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    # Universal so one build serves both Apple Silicon and Intel.
    ARCHS: "$(ARCHS_STANDARD)"
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
  configs:
    # Two things are set per-configuration here, and the signing pair is set on the
    # Monitor configurations *only* — deliberately.
    #
    # A project-level build setting outranks the project's base configuration file, so a
    # CODE_SIGN_IDENTITY of "-" written here in `base` would silently override whatever
    # Configs/Signing.xcconfig says, and every Full build would come out ad-hoc signed no
    # matter what certificate the maintainer holds. An ad-hoc-signed helper is one
    # SMAppService will not register and one that, per ADR 0005, refuses every client
    # because it can read no Team ID from its own signature — so the failure would look
    # like "registration is impossible on this project" rather than like a build setting.
    #
    # Leaving the Full configurations unset here lets Signing.xcconfig supply both.
    #
    # AEOLUS_EMBEDS_HELPER drives the app target's embed script. It is read there as
    # ${AEOLUS_EMBEDS_HELPER:-NO}, so a configuration that forgets to set it embeds
    # nothing: the default answer to "should this build ship a root daemon" is no.
    Monitor Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG MONITOR_ONLY
      AEOLUS_EMBEDS_HELPER: NO
      CODE_SIGN_IDENTITY: "-"
      DEVELOPMENT_TEAM: ""
    Monitor Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: MONITOR_ONLY
      AEOLUS_EMBEDS_HELPER: NO
      CODE_SIGN_IDENTITY: "-"
      DEVELOPMENT_TEAM: ""
    Full Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      AEOLUS_EMBEDS_HELPER: YES
    Full Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
      AEOLUS_EMBEDS_HELPER: YES

# Signing.xcconfig is gitignored and absent on contributor machines and on CI. It is
# included only by the Full configurations, so its absence cannot break a Monitor build.
configFiles:
  Full Debug: Configs/Signing.xcconfig
  Full Release: Configs/Signing.xcconfig

packages:
  AeolusPackage:
    path: .

targets:
  Aeolus:
    type: application
    platform: macOS
    # Only the entry point is compiled here. The views themselves live in the AeolusUI
    # library so `swift build` covers them, which is what lets CI type-check the whole
    # UI without an app bundle or a signing identity.
    sources:
      - path: Sources/Aeolus/main.swift
      # Resources/catalog is not listed here on purpose. FanKit's own Package.swift
      # resource declaration already embeds it as Aeolus_FanKit.bundle — the one
      # CatalogLoader actually reads via Bundle(for:)-based lookup — and this app
      # target used to also copy the raw files loose into Contents/Resources.
      # Nothing read that second copy; it was a duplicate a maintainer could edit
      # and see no effect from. See CatalogLoader.locateResourceBundle().
    dependencies:
      - package: AeolusPackage
        product: AeolusUI
      - package: AeolusPackage
        product: SMCCore
      - package: AeolusPackage
        product: FanKit
      - package: AeolusPackage
        product: AeolusXPC
      # Builds the helper before the app, so the embed script below always has a finished
      # binary to copy. Deliberately neither linked nor embedded by Xcode: embedding is
      # done by that script, because a Copy Files phase cannot be made conditional on the
      # configuration and the helper must not appear in a Monitor bundle.
      #
      # This does mean the Monitor scheme *compiles* the helper — exactly as `swift build`
      # already does on every contributor's machine and on CI. What Monitor never does is
      # ship it or register it: the bundle it produces contains no helper and no launchd
      # description, and `HelperBundleLayout` reports that at runtime by asking the bundle
      # rather than by trusting a compile-time flag.
      - target: AeolusHelper
        link: false
        embed: false
    info:
      path: Configs/Aeolus-Info.plist
      properties:
        CFBundleName: Aeolus
        CFBundleDisplayName: Aeolus
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        # Menu-bar-first application. The main window is opened from the menu bar item.
        LSUIElement: false
        NSHumanReadableCopyright: "Licensed under the GNU General Public License v3.0 or later."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blamechris.Aeolus
        PRODUCT_NAME: Aeolus
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Full Debug:
          CODE_SIGN_ENTITLEMENTS: Configs/Aeolus.entitlements
        Full Release:
          CODE_SIGN_ENTITLEMENTS: Configs/Aeolus.entitlements
    postBuildScripts:
      # Embeds the privileged helper — Full configurations only.
      #
      # A script rather than a Copy Files phase because Xcode copy phases cannot be made
      # conditional on the configuration, and "the helper is absent from Monitor" is a
      # safety property rather than a preference: an ad-hoc-signed root daemon cannot
      # express a stable client code-signing requirement, so a Monitor bundle that
      # contained one would be a daemon nothing could safely authorise. See
      # docs/ADR/0005-xpc-authorisation.md.
      #
      # Runs after every other build phase and before the app's own code signing, so the
      # helper — already signed by its own target, with its own entitlements — is sealed
      # into the app's signature as nested code.
      - name: Embed privileged helper (Full only)
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail

          CONTENTS="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}"
          HELPER_DESTINATION="${CONTENTS}/MacOS/AeolusHelper"
          DAEMONS_DESTINATION="${CONTENTS}/Library/LaunchDaemons"
          PLIST_NAME="com.blamechris.Aeolus.Helper.plist"

          if [ "${AEOLUS_EMBEDS_HELPER:-NO}" != "YES" ]; then
              # Monitor, or any configuration that did not explicitly opt in. The removals
              # are not paranoia: DerivedData is shared between schemes, so a Full build
              # followed by a Monitor build would otherwise leave a root daemon and its
              # launchd description inside a bundle that is supposed to contain neither.
              rm -f "${HELPER_DESTINATION}"
              rm -rf "${DAEMONS_DESTINATION}"
              # Leaves no empty Contents/Library behind either: a directory that only ever
              # exists to hold launch daemons should not sit in a bundle that ships none.
              rmdir "${CONTENTS}/Library" 2>/dev/null || true
              exit 0
          fi

          HELPER_SOURCE="${BUILT_PRODUCTS_DIR}/AeolusHelper"
          PLIST_SOURCE="${SRCROOT}/Configs/LaunchDaemons/${PLIST_NAME}"

          if [ ! -f "${HELPER_SOURCE}" ]; then
              echo "error: helper executable not found at ${HELPER_SOURCE}"
              exit 1
          fi
          if [ ! -f "${PLIST_SOURCE}" ]; then
              echo "error: launchd plist not found at ${PLIST_SOURCE}"
              exit 1
          fi

          # launchd resolves BundleProgram against the app bundle. If it ever stops naming
          # where this script puts the helper, the daemon registers and then never starts
          # — a failure that surfaces on a user's machine rather than here. Fail the build
          # instead. Tests/AeolusUITests/LaunchDaemonPlistTests.swift asserts the same
          # agreement from the Swift side.
          BUNDLE_PROGRAM=$(/usr/libexec/PlistBuddy -c "Print :BundleProgram" "${PLIST_SOURCE}")
          if [ "${BUNDLE_PROGRAM}" != "Contents/MacOS/AeolusHelper" ]; then
              echo "error: BundleProgram is '${BUNDLE_PROGRAM}' but the helper is embedded at Contents/MacOS/AeolusHelper"
              exit 1
          fi

          mkdir -p "${DAEMONS_DESTINATION}"
          /usr/bin/ditto "${HELPER_SOURCE}" "${HELPER_DESTINATION}"
          /usr/bin/ditto "${PLIST_SOURCE}" "${DAEMONS_DESTINATION}/${PLIST_NAME}"

  # The root launch daemon, as an Xcode target so it can be signed with its own
  # entitlements and embedded in the app bundle. The same sources build under
  # `swift build` as an SPM executable; this target exists for the one thing SPM cannot
  # do, which is produce a signed binary inside a signed app.
  #
  # SMAppService requires the app and its embedded daemon to share a Team ID from a real
  # Developer ID certificate. Both get theirs from Configs/Signing.xcconfig, which is
  # gitignored and applied to the Full configurations only — so nothing here can leak a
  # Team ID into the repository, and its absence cannot break a Monitor build.
  AeolusHelper:
    type: tool
    platform: macOS
    sources:
      - path: Sources/AeolusHelper
    dependencies:
      - package: AeolusPackage
        product: SMCCore
      - package: AeolusPackage
        product: FanKit
      - package: AeolusPackage
        product: AeolusXPC
    # A command-line tool has nowhere to put an Info.plist except inside its own binary.
    # It is there for one reason: it fixes the helper's code-signing identifier, which is
    # what a client pins when it sets its side of the XPC code-signing requirement. Left
    # to codesign's default the identifier would be derived from the file name, which is
    # a weaker thing to depend on than an explicit bundle identifier.
    info:
      path: Configs/AeolusHelper-Info.plist
      properties:
        CFBundleIdentifier: com.blamechris.Aeolus.Helper
        CFBundleName: AeolusHelper
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    settings:
      base:
        PRODUCT_NAME: AeolusHelper
        PRODUCT_BUNDLE_IDENTIFIER: com.blamechris.Aeolus.Helper
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        # The helper's only home is inside Aeolus.app. It is never installed to a path of
        # its own, and must not be swept into an archive as a standalone product.
        SKIP_INSTALL: YES
      configs:
        Full Debug:
          CODE_SIGN_ENTITLEMENTS: Configs/AeolusHelper.entitlements
        Full Release:
          CODE_SIGN_ENTITLEMENTS: Configs/AeolusHelper.entitlements

schemes:
  Aeolus (Monitor):
    build:
      targets:
        Aeolus: all
    run:
      config: Monitor Debug
    test:
      config: Monitor Debug
    archive:
      config: Monitor Release
  Aeolus (Full):
    build:
      targets:
        Aeolus: all
    run:
      config: Full Debug
    archive:
      config: Full Release
